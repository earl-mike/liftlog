<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LiftLog</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0d0f;--card:#17171b;--card2:#1f1f25;--line:#2a2a32;
  --lime:#c8ff00;--dim:#6b6b78;--dim2:#9a9aa8;--txt:#f2f2f5;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--txt);font-family:'DM Sans',sans-serif;padding:0 0 40px;}
.top{padding:22px 20px 0;}
.title{font-family:'Bebas Neue',sans-serif;font-size:38px;letter-spacing:1px;line-height:1;}
.title span{color:var(--lime);}
.wknav{display:flex;align-items:center;gap:14px;margin-top:12px;}
.wkbtn{background:var(--card);border:1.5px solid var(--line);border-radius:10px;color:var(--dim2);
  font-size:17px;width:34px;height:34px;cursor:pointer;line-height:1;}
.wkbtn:disabled{opacity:.3;}
.wklbl{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1px;}
.unit{margin-left:auto;background:var(--card);border:1.5px solid var(--line);border-radius:10px;
  color:var(--dim2);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;
  padding:8px 14px;cursor:pointer;}
.unit b{color:var(--lime);}
.saved{font-size:12px;color:var(--dim);margin-top:10px;display:flex;align-items:center;gap:6px;}
.saved .dot{width:7px;height:7px;border-radius:50%;background:var(--dim);}
.saved.ok .dot{background:var(--lime);}.saved.ok{color:var(--lime);}
.days{display:flex;gap:8px;overflow-x:auto;padding:20px;scrollbar-width:none;}
.days::-webkit-scrollbar{display:none;}
.day{flex-shrink:0;background:var(--card);border:1.5px solid var(--line);border-radius:14px;
  padding:12px 18px;cursor:pointer;text-align:center;min-width:76px;transition:.15s;}
.day .n{font-family:'Bebas Neue',sans-serif;font-size:24px;line-height:1;color:var(--dim2);}
.day .l{font-size:10px;color:var(--dim);margin-top:3px;letter-spacing:.5px;}
.day.on{background:var(--lime);border-color:var(--lime);}
.day.on .n,.day.on .l{color:#000;}
.day.done .n{color:var(--lime);}
.wrap{padding:0 20px;}
.dayname{font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:1px;margin-bottom:2px;}
.daysub{font-size:13px;color:var(--dim);}
.bar{height:5px;background:var(--card2);border-radius:99px;overflow:hidden;margin:14px 0 6px;}
.fill{height:100%;background:var(--lime);border-radius:99px;transition:width .3s;}
.count{font-size:12px;color:var(--dim);margin-bottom:20px;}
.ex{background:var(--card);border:1.5px solid var(--line);border-radius:16px;
  padding:16px 18px;margin-bottom:10px;display:flex;flex-direction:column;gap:12px;transition:.15s;}
.ex.filled{border-color:var(--lime);}
.exmain{flex:1;min-width:0;}
.exname{font-size:16px;font-weight:500;line-height:1.3;}
.tier{font-family:'DM Sans',sans-serif;font-size:10px;font-weight:700;padding:2px 6px;
  border-radius:5px;margin-right:7px;vertical-align:2px;}
.t-sp{background:#ff6b3524;color:#ff6b35;}
.t-s{background:#c8ff0018;color:var(--lime);}
.t-a{background:#4fc3f718;color:#4fc3f7;}
.exreps{font-size:12px;color:var(--dim);margin-top:3px;}
.exlast{font-size:12px;color:var(--dim);margin-top:3px;}
.exlast b{color:var(--dim2);font-weight:500;}
.sugtag{font-size:11px;color:var(--dim);margin-top:3px;font-style:italic;}
.wbox{display:flex;align-items:center;gap:2px;background:var(--card2);border:1.5px solid var(--line);
  border-radius:12px;padding:0 12px 0 4px;flex-shrink:0;transition:.15s;}
.ex.filled .wbox{border-color:var(--lime);background:#c8ff000d;}
.ex.sug .wbox{border-style:dashed;}
.winp{background:none;border:none;color:var(--txt);font-family:'Bebas Neue',sans-serif;
  font-size:30px;width:74px;text-align:center;padding:12px 0;outline:none;
  -moz-appearance:textfield;letter-spacing:1px;}
.winp::-webkit-outer-spin-button,.winp::-webkit-inner-spin-button{-webkit-appearance:none;}
.winp::placeholder{color:var(--dim);}
.ex.filled .winp{color:var(--lime);}
.ex.sug .winp{color:var(--dim);}
.u{font-size:12px;color:var(--dim);}
.ok{background:none;border:1.5px solid var(--lime);border-radius:9px;color:var(--lime);
  font-size:15px;padding:9px 11px;cursor:pointer;flex-shrink:0;line-height:1;}
.notes{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:16px;
  color:var(--txt);font-family:'DM Sans',sans-serif;font-size:15px;padding:16px 18px;
  resize:none;min-height:80px;margin-top:18px;outline:none;}
.notes:focus{border-color:var(--lime);}
.notes::placeholder{color:var(--dim);}
.fin{width:100%;margin-top:12px;background:none;border:1.5px solid var(--line);border-radius:16px;
  color:var(--dim2);font-family:'DM Sans',sans-serif;font-size:15px;font-weight:500;
  padding:17px;cursor:pointer;transition:.15s;}
.fin.done{background:var(--lime);border-color:var(--lime);color:#000;}
.next{width:100%;margin-top:10px;background:var(--lime);border:none;border-radius:16px;color:#000;
  font-family:'DM Sans',sans-serif;font-size:15px;font-weight:700;padding:17px;cursor:pointer;}
.copy{width:100%;margin-top:10px;background:none;border:1.5px solid var(--line);border-radius:16px;
  color:var(--dim2);font-family:'DM Sans',sans-serif;font-size:14px;padding:15px;cursor:pointer;}
.editbtn{background:var(--card);border:1.5px solid var(--line);border-radius:10px;color:var(--dim2);
  font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;padding:8px 14px;cursor:pointer;}
.editbtn.on{background:var(--lime);border-color:var(--lime);color:#000;}
.rowtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;}
.arr{display:flex;flex-direction:column;gap:3px;flex-shrink:0;margin-left:auto;}
.arr button{background:var(--card2);border:1px solid var(--line);border-radius:6px;color:var(--dim2);
  font-size:9px;padding:3px 7px;cursor:pointer;line-height:1;}
.arr button:active{background:var(--lime);color:#000;}
.tools{display:flex;gap:6px;margin-top:9px;}
.right{display:flex;flex-direction:row;align-items:center;gap:10px;}
.tool{background:var(--card2);border:1px solid var(--line);border-radius:7px;color:var(--dim2);
  font-size:11px;padding:5px 9px;cursor:pointer;font-family:'DM Sans',sans-serif;}
.tool.lk{border-color:#b388ff;color:#b388ff;}
.tool.sel{border-color:var(--lime);color:var(--lime);}
.tool.del{border-color:#ff6b35;color:#ff6b35;}
.pen{background:none;border:none;color:var(--dim);font-size:12px;padding:2px 5px;cursor:pointer;flex-shrink:0;}
.pen:hover{color:var(--lime);}
.nameinp{background:var(--card2);border:1.5px solid var(--lime);border-radius:8px;color:var(--lime);
  font-family:'DM Sans',sans-serif;font-size:15px;font-weight:500;padding:6px 10px;
  flex:1;min-width:0;outline:none;display:none;}
.nameok{background:var(--lime);border:none;border-radius:7px;color:#000;font-family:'DM Sans',sans-serif;
  font-size:12px;font-weight:700;padding:7px 10px;cursor:pointer;flex-shrink:0;display:none;margin-left:6px;}
.namewrap{display:flex;align-items:flex-start;gap:4px;width:100%;}
.exname.custom{color:var(--lime);}
.ex.pair{border-color:#b388ff;}
.pairlbl{font-size:10px;color:#b388ff;letter-spacing:1.5px;margin:4px 0 6px 2px;font-weight:700;}
.pairwrap{border-left:2px solid #b388ff;padding-left:10px;margin-bottom:10px;}
.ex.bonus{border-style:dashed;border-color:#4fc3f7;}
.ex.bonus .exname{color:#4fc3f7;}
.addbtn{width:100%;background:none;border:1.5px dashed var(--line);border-radius:16px;color:var(--dim);
  font-family:'DM Sans',sans-serif;font-size:14px;padding:15px;cursor:pointer;margin-bottom:10px;}
.load{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;
  justify-content:center;z-index:99;font-family:'Bebas Neue',sans-serif;font-size:34px;color:var(--lime);}
</style>
</head>
<body>
<div class="load" id="load">LIFTLOG</div>
<div class="top">
  <div class="title">LIFT<span>LOG</span></div>
  <div class="wknav">
    <button class="wkbtn" id="wkprev" onclick="wk(-1)">‹</button>
    <div class="wklbl" id="cyc">WEEK 1</div>
    <button class="wkbtn" id="wknext" onclick="wk(1)">›</button>
    <button class="unit" id="unitbtn" onclick="tog()"></button>
  </div>
  <div class="saved" id="save"><span class="dot"></span><span id="savetxt">Loading</span></div>
</div>
<div class="days" id="days"></div>
<div class="wrap" id="body"></div>
<script>
const KEY='$2a$10$O7oW0lYtp956/on9QP2vn.QZyrXAPrVj/ubAanzM02gjSdb9Tu2NK';
const BIN='69cc5e04aaba882197b1af4d';
let D={cycles:{}},cur=1,day=0,timer=null,edit=false,linkFrom=null;

const P=[
 {id:'day1',n:'1',t:'CHEST',full:'CHEST + TRICEPS',ex:[
  ['Barbell Bench Press','S+','6–8'],['Incline Dumbbell Press','S','8–10'],
  ['Machine Chest Press','S','10–12'],['Bottom Up Cable Fly','A','12–15'],
  ['EZ-Bar Skullcrusher','S','10–12'],['Overhead Cable Tri Ext','S','12–15'],
  ['Rope Pushdown','A','15–20']]},
 {id:'day2',n:'2',t:'BACK',full:'BACK + BICEPS',ex:[
  ['Chest Supported Row','S+','8–10'],['Single Arm Lat Pulldown','S','10–12'],
  ['Neutral Grip Lat Pulldown','S','10–12'],['Single Arm Cable Row','S','10–12'],
  ['Bayesian Cable Curl','S+','10–12'],['Preacher Curl','S','10–12'],
  ['Hammer Curl','S','12–15']]},
 {id:'day3',n:'3',t:'SHLDR',full:'SHOULDERS + UPPER BACK',ex:[
  ['Dumbbell Shoulder Press','S','8–10'],['Lean Away Lateral Raise','S+','15–20'],
  ['Cable Lateral Raise','S','15–20'],['Cable Upright Row','S','12–15'],
  ['Rear Delt Cable Fly','S+','15–20'],['Face Pull','S+','15–20'],
  ['Cable Y Raise','A','15–20']]},
 {id:'day4',n:'4',t:'CHEST',full:'CHEST + TRICEPS',ex:[
  ['Incline Barbell Press','S+','6–8'],['Incline Machine Press','S','10–12'],
  ['Cable Pec Fly','S','12–15'],['Bottom Up Cable Fly','A','12–15'],
  ['Overhead Cable Tri Ext','S','12–15'],['EZ-Bar Skullcrusher','S','10–12'],
  ['Single Arm Pushdown','A','15–20']]},
 {id:'day5',n:'5',t:'BACK',full:'BACK + BICEPS',ex:[
  ['Close Grip Cable Row','S+','10–12'],['Wide Grip Lat Pulldown','S','10–12'],
  ['Chest Supported Row','S+','8–10'],['Cable Straight Arm Pulldown','S','12–15'],
  ['Bayesian Cable Curl','S+','10–12'],['Incline DB Curl','S','10–12'],
  ['Preacher Curl','S','10–12']]},
 {id:'day6',n:'6',t:'LEGS',full:'LEGS + LATERAL DELTS',ex:[
  ['Front Squat','S+','5–8'],['Leg Press (high foot)','S','10–12'],
  ['Hip Thrust','S+','10–12'],['Bulgarian Split Squat','S','10–12'],
  ['Leg Extension (controlled)','S','15–20'],
  ['Lean Away Lateral Raise','S+','15–20'],['Cable Lateral Raise','S','15–20']]}
];


const C=c=>D.cycles[`c${c}`]||(D.cycles[`c${c}`]={});
const Dy=(c,d)=>{const x=C(c);return x[d]||(x[d]={done:false,note:''});};
// Reads BOTH shapes: old 4-set arrays (takes the heaviest) and new single values.
function getW(c,d,i){
  const v=D.cycles?.[`c${c}`]?.[d]?.[`e${i}`];
  if(Array.isArray(v)){const n=v.filter(Boolean).map(Number).filter(x=>!isNaN(x));
    return n.length?String(Math.max(...n)):'';}
  return v||'';
}
const setW=(c,d,i,v)=>{Dy(c,d);D.cycles[`c${c}`][d][`e${i}`]=v;save();};
function lastW(d,i){for(let c=cur-1;c>=1;c--){const v=getW(c,d,i);if(v)return v;}return '';}
function maxWk(){let m=1;Object.keys(D.cycles||{}).forEach(k=>{const n=+k.slice(1);if(n>m)m=n;});return m;}
const unit=()=>D.unit||'kg';

// ---- name overrides ----
const NO=()=>D.nameOverrides||(D.nameOverrides={});
const exName=(d,i)=>NO()[`${d}_${i}`]||null;
function setExName(d,i,v){if(v)NO()[`${d}_${i}`]=v;else delete NO()[`${d}_${i}`];save();}

// ---- bonus exercises (per week, carried forward) ----
function bonus(c,d){
  const now=D.cycles?.[`c${c}`]?.[d]?.bonus||[];
  if(c<=1)return now;
  const prev=bonus(c-1,d);
  const gone=D.cycles?.[`c${c}`]?.[d]?.bonusRemoved||[];
  const names=now.map(b=>b.name);
  return [...now,...prev.filter(b=>!gone.includes(b.name)&&!names.includes(b.name))
    .map(b=>({name:b.name,w:''}))];
}
function setBonus(c,d,a){Dy(c,d);D.cycles[`c${c}`][d].bonus=a;save();}
function bonusW(c,d,name){return (D.cycles?.[`c${c}`]?.[d]?.bonus||[]).find(b=>b.name===name)?.w||'';}
function setBonusW(c,d,name,v){
  Dy(c,d);const a=D.cycles[`c${c}`][d].bonus||[];
  const e=a.find(b=>b.name===name);
  if(e)e.w=v;else a.push({name,w:v});
  D.cycles[`c${c}`][d].bonus=a;save();
}
function lastBonusW(d,name){for(let c=cur-1;c>=1;c--){const v=bonusW(c,d,name);if(v)return v;}return '';}
function delBonus(d,name){
  Dy(cur,d);const dd=D.cycles[`c${cur}`][d];
  dd.bonus=(dd.bonus||[]).filter(b=>b.name!==name);
  const g=dd.bonusRemoved||[];if(!g.includes(name))g.push(name);
  dd.bonusRemoved=g;save();render();
}

// ---- supersets (pairs) ----
const SS=(c,d)=>D.cycles?.[`c${c}`]?.[d]?.ss||[];
function setSS(c,d,a){Dy(c,d);D.cycles[`c${c}`][d].ss=a;save();}
const paired=(d,k)=>SS(cur,d).some(p=>p.includes(k));
function toggleLink(k){
  const d=P[day].id,a=SS(cur,d).slice();
  const has=a.find(p=>p.includes(k));
  if(has){setSS(cur,d,a.filter(p=>p!==has));linkFrom=null;render();return;}
  if(linkFrom===null){linkFrom=k;render();return;}
  if(linkFrom!==k){a.push([linkFrom,k]);setSS(cur,d,a);}
  linkFrom=null;render();
}

// ---- ordering ----
function order(d){const s=NO()[`ord_${d}`];return s?JSON.parse(s):null;}
function setOrder(d,a){NO()[`ord_${d}`]=JSON.stringify(a);save();}
function items(){
  const d=P[day];
  const base=d.ex.map((e,i)=>({k:`prog_${i}`,i,e}));
  const bon=bonus(cur,d.id).map(b=>({k:`bon_${b.name}`,bonus:b}));
  const all=[...base,...bon];
  const o=order(d.id);
  if(!o)return all;
  const m={};all.forEach(x=>m[x.k]=x);
  const out=[];o.forEach(k=>{if(m[k]){out.push(m[k]);delete m[k];}});
  Object.values(m).forEach(x=>out.push(x));
  return out;
}
function move(k,dir){
  const d=P[day].id,all=items().map(x=>x.k);
  let o=(order(d)||[]).filter(x=>all.includes(x));
  all.forEach(x=>{if(!o.includes(x))o.push(x);});
  const p=o.indexOf(k);if(p<0)return;
  const n=p+dir;if(n<0||n>=o.length)return;
  o.splice(p,1);o.splice(n,0,k);
  setOrder(d,o);render();
}

function status(ok,txt){const e=document.getElementById('save');
  e.className='saved'+(ok?' ok':'');document.getElementById('savetxt').textContent=txt;}
function save(){clearTimeout(timer);timer=setTimeout(push,1200);}
async function push(){
  status(false,'Saving');
  localStorage.setItem('ll_v6_backup',JSON.stringify(D));
  try{await fetch(`https://api.jsonbin.io/v3/b/${BIN}`,{method:'PUT',
    headers:{'Content-Type':'application/json','X-Master-Key':KEY},body:JSON.stringify(D)});
    status(true,'Saved');}catch(e){status(false,'Offline');}
}
async function load(){
  const c=localStorage.getItem('ll_v6_backup');
  if(c){try{D=JSON.parse(c);if(!D.cycles)D.cycles={};}catch(e){D={cycles:{}};}
    document.getElementById('load').style.display='none';openLatest();render();}
  try{
    const r=await fetch(`https://api.jsonbin.io/v3/b/${BIN}/latest`,{headers:{'X-Master-Key':KEY}});
    const j=await r.json();
    if(j.record&&j.record.cycles)D=j.record; else if(!c)D={cycles:{}};
    localStorage.setItem('ll_v6_backup',JSON.stringify(D));
    status(true,'Saved');
  }catch(e){status(false,'Offline');}
  document.getElementById('load').style.display='none';
  openLatest();render();
}
function openLatest(){
  const m=maxWk();if(m>cur)cur=m;
  for(let i=P.length-1;i>=0;i--){
    const d=P[i];if(d.ex.some((_,j)=>getW(cur,d.id,j))){
      day=(D.cycles?.[`c${cur}`]?.[d.id]?.done&&i<P.length-1)?i+1:i;return;}
  }
  day=0;
}
function tog(){
  const from=unit(),to=from==='kg'?'lbs':'kg',f=to==='lbs'?2.2046:1/2.2046;
  Object.keys(D.cycles||{}).forEach(ck=>{
    const cy=D.cycles[ck];if(!cy)return;
    Object.keys(cy).forEach(dk=>{
      const dd=cy[dk];if(!dd||typeof dd!=='object')return;
      Object.keys(dd).forEach(k=>{
        if(!/^e\d+$/.test(k))return;
        const v=dd[k];
        if(Array.isArray(v)){dd[k]=v.map(x=>x?String(Math.round(Number(x)*f*2)/2):x);}
        else if(v){dd[k]=String(Math.round(Number(v)*f*2)/2);}
      });
      if(Array.isArray(dd.bonus))dd.bonus.forEach(b=>{
        if(b&&b.w)b.w=String(Math.round(Number(b.w)*f*2)/2);});
    });
  });
  D.unit=to;save();render();
}
function render(){
  document.getElementById('cyc').textContent='WEEK '+cur;
  document.getElementById('wkprev').disabled=cur<=1;
  document.getElementById('unitbtn').innerHTML=unit()==='kg'?'<b>KG</b> / LBS':'KG / <b>LBS</b>';
  document.getElementById('days').innerHTML=P.map((d,i)=>{
    const done=D.cycles?.[`c${cur}`]?.[d.id]?.done;
    return`<div class="day${i===day?' on':''}${done?' done':''}" onclick="go(${i})">
      <div class="n">${d.n}</div><div class="l">${d.t}</div></div>`;}).join('');

  const d=P[day],u=unit();
  const done=D.cycles?.[`c${cur}`]?.[d.id]?.done;
  const note=D.cycles?.[`c${cur}`]?.[d.id]?.note||'';
  const list=items();
  let n=0,tot=list.length;
  list.forEach(x=>{const v=x.bonus?bonusW(cur,d.id,x.bonus.name):getW(cur,d.id,x.i);if(v)n++;});

  // group linked pairs that sit next to each other in the order
  let html='',seen=new Set();
  list.forEach(x=>{
    if(seen.has(x.k))return;
    const pr=SS(cur,d.id).find(p=>p.includes(x.k));
    if(pr){
      const ok=pr.find(z=>z!==x.k);
      const other=list.find(z=>z.k===ok);
      if(other){seen.add(x.k);seen.add(ok);
        html+=`<div class="pairwrap"><div class="pairlbl">◈ LINKED</div>${card(x,d,u)}${card(other,d,u)}</div>`;
        return;}
    }
    seen.add(x.k);html+=card(x,d,u);
  });

  document.getElementById('body').innerHTML=`
    <div class="dayname">DAY ${d.n}</div>
    <div class="daysub">${d.full}</div>
    <div class="bar"><div class="fill" style="width:${tot?n/tot*100:0}%"></div></div>
    <div class="count">${n} of ${tot} logged</div>
    ${html}
    <button class="addbtn" onclick="addEx()">+ Add exercise</button>
    <textarea class="notes" placeholder="Session notes…" oninput="nt(this.value)">${note}</textarea>
    <button class="fin${done?' done':''}" onclick="fin()">${done?'✓ Session finished':'Finish session'}</button>
    ${allDone()&&cur===maxWk()?`<button class="next" onclick="newWk()">Start Week ${cur+1} →</button>`:''}
    <button class="copy" onclick="exp()">⬆ Copy for Claude</button>`;
}

function card(x,d,u){
  const isB=!!x.bonus;
  const cust=isB?false:!!exName(d.id,x.i);
  const name=isB?x.bonus.name:(exName(d.id,x.i)||x.e[0]);
  const w=isB?bonusW(cur,d.id,x.bonus.name):getW(cur,d.id,x.i);
  const lw=isB?lastBonusW(d.id,x.bonus.name):lastW(d.id,x.i);
  const sug=!w&&lw, val=w||lw;
  const pr=paired(d.id,x.k), sel=linkFrom===x.k;
  const badge=isB?`<span class="tier t-a">+</span>`
    :`<span class="tier ${x.e[1]==='S+'?'t-sp':x.e[1]==='S'?'t-s':'t-a'}">${x.e[1]}</span>`;
  const meta=isB?'log heaviest':`${x.e[2]} reps · 4 sets · log heaviest`;
  const set=isB?`setBonusW(cur,'${d.id}',${JSON.stringify(x.bonus.name)},this.value)`
               :`w(${x.i},this.value)`;
  return`<div class="ex${w?' filled':''}${sug?' sug':''}${pr?' pair':''}${isB?' bonus':''}" id="c_${x.k}">
    <div class="exmain">
      <div class="namewrap">
        <span class="exname${cust?' custom':''}" id="n_${x.k}" onclick="ren('${x.k}')">${badge}${name}</span>
        <button class="pen" id="p_${x.k}" onclick="ren('${x.k}')">✎</button>
        <input class="nameinp" id="i_${x.k}" maxlength="40"
          onkeydown="if(event.key==='Enter')renOk('${x.k}')">
        <button class="nameok" id="k_${x.k}" onclick="renOk('${x.k}')">✓</button>
      </div>
      <div class="exreps">${meta}</div>
      ${sug?`<div class="sugtag">Suggested from last week</div>`
           :lw?`<div class="exlast">Last: <b>${lw} ${u}</b></div>`:''}
    </div>
    <div class="right">
      <button class="tool lk${sel?' sel':''}" onclick="toggleLink('${x.k}')">${pr?'Unlink':sel?'Pick…':'Link'}</button>
      ${isB?`<button class="tool del" onclick="delBonus('${d.id}',${JSON.stringify(x.bonus.name)})">✕</button>`:''}
      <div class="wbox">
        <input class="winp" type="number" inputmode="decimal" step="2.5" placeholder="—"
          value="${val}" oninput="${set};mark('${x.k}',this.value)">
        <span class="u">${u}</span>
      </div>
      ${sug?`<button class="ok" onclick="okv('${x.k}','${lw}')">✓</button>`:''}
      <div class="arr">
        <button onclick="move('${x.k}',-1)">▲</button>
        <button onclick="move('${x.k}',1)">▼</button>
      </div>
    </div>
  </div>`;
}

function mark(k,v){
  const row=document.getElementById('c_'+k);if(!row)return;
  row.classList.toggle('filled',!!v);
  if(v){row.classList.remove('sug');
    const b=row.querySelector('.ok');if(b)b.remove();
    const t=row.querySelector('.sugtag');if(t)t.remove();}
  const d=P[day];let n=0;const list=items();
  list.forEach(x=>{const val=x.bonus?bonusW(cur,d.id,x.bonus.name):getW(cur,d.id,x.i);if(val)n++;});
  document.querySelector('.fill').style.width=(list.length?n/list.length*100:0)+'%';
  document.querySelector('.count').textContent=`${n} of ${list.length} logged`;
}
function okv(k,v){
  const x=items().find(z=>z.k===k);if(!x)return;
  if(x.bonus)setBonusW(cur,P[day].id,x.bonus.name,v);else setW(cur,P[day].id,x.i,v);
  render();
}
function ed(){edit=!edit;linkFrom=null;render();}
function ren(k){
  const n=document.getElementById('n_'+k),i=document.getElementById('i_'+k),
        p=document.getElementById('p_'+k),ok=document.getElementById('k_'+k);
  if(!n||!i)return;
  const x=items().find(z=>z.k===k);if(!x)return;
  i.value=x.bonus?x.bonus.name:(exName(P[day].id,x.i)||x.e[0]);
  n.style.display='none';p.style.display='none';
  i.style.display='block';ok.style.display='block';
  i.focus();i.select();
}
function renOk(k){
  const d=P[day],i=document.getElementById('i_'+k);
  const x=items().find(z=>z.k===k);if(!x||!i)return;
  const nv=i.value.trim();
  if(x.bonus){
    if(nv&&nv!==x.bonus.name){
      const a=(D.cycles?.[`c${cur}`]?.[d.id]?.bonus||[]).slice();
      const e=a.find(b=>b.name===x.bonus.name);
      if(e)e.name=nv;else a.push({name:nv,w:''});
      setBonus(cur,d.id,a);
    }
  }else{
    setExName(d.id,x.i,(!nv||nv===x.e[0])?null:nv);
  }
  render();
}
function addEx(){
  const d=P[day].id;
  const a=(D.cycles?.[`c${cur}`]?.[d]?.bonus||[]).slice();
  let nm='New Exercise',i=2;
  while(a.some(b=>b.name===nm))nm='New Exercise '+(i++);
  a.push({name:nm,w:''});
  setBonus(cur,d,a);render();
  ren('bon_'+nm);   // open inline editor immediately, as the old app did
}
function allDone(){return P.every(d=>D.cycles?.[`c${cur}`]?.[d.id]?.done);}
function go(i){day=i;linkFrom=null;render();window.scrollTo({top:0,behavior:'smooth'});}
function w(i,v){setW(cur,P[day].id,i,v);}
function nt(v){Dy(cur,P[day].id).note=v;D.cycles[`c${cur}`][P[day].id].note=v;save();}
function fin(){const k=P[day].id;Dy(cur,k);D.cycles[`c${cur}`][k].done=!D.cycles[`c${cur}`][k].done;save();render();}
function wk(dir){const n=cur+dir;if(n<1)return;cur=n;render();window.scrollTo({top:0});}
function newWk(){cur=maxWk()+1;C(cur);day=0;save();render();window.scrollTo({top:0});}
function exp(){
  const m=maxWk(),u=unit();
  let t=`LIFTLOG — TRAINING HISTORY\nWeek ${cur} of ${m} · ${u.toUpperCase()} · heaviest set logged\n\n`;
  for(let c=1;c<=m;c++){
    let any=false;
    P.forEach(d=>{if(d.ex.some((_,i)=>getW(c,d.id,i)))any=true;
      if((D.cycles?.[`c${c}`]?.[d.id]?.bonus||[]).some(b=>b.w))any=true;});
    if(!any)continue;
    t+=`── WEEK ${c} ──\n`;
    P.forEach(d=>{
      const rows=[];
      d.ex.forEach((e,i)=>{const v=getW(c,d.id,i);if(!v)return;
        const nm=exName(d.id,i);
        rows.push(`  ${nm?`${nm} (sub for ${e[0]})`:e[0]} [${e[1]}]: ${v}${u}`);});
      (D.cycles?.[`c${c}`]?.[d.id]?.bonus||[]).forEach(b=>{
        if(b.w)rows.push(`  ${b.name} [added]: ${b.w}${u}`);});
      const nt=D.cycles?.[`c${c}`]?.[d.id]?.note;
      if(!rows.length&&!nt)return;
      t+=`${d.full}\n${rows.join('\n')}\n`;if(nt)t+=`  Notes: ${nt}\n`;
    });
    t+='\n';
  }
  t+=`── PROGRESSION ──\n`;
  P.forEach(d=>d.ex.forEach((e,i)=>{
    const h=[];for(let c=1;c<=m;c++){const v=getW(c,d.id,i);if(v)h.push(`W${c}:${v}`);}
    if(h.length>1)t+=`  ${exName(d.id,i)||e[0]}: ${h.join(' → ')}\n`;
  }));
  t+=`\nPaste into Claude and say "cycle check-in".`;
  navigator.clipboard.writeText(t).then(()=>alert('Copied!')).catch(()=>prompt('Copy:',t));
}
load();
</script>
