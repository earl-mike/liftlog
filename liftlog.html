<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LiftLog — Travel</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--surface:#111;--surface2:#1a1a1a;--border:#222;--accent:#4fc3f7;--accent2:#ff6b35;--blue:#4fc3f7;--purple:#b388ff;--green:#69f0ae;--text:#f0f0f0;--muted:#555;--muted2:#888;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;padding:20px;}
header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:24px;border-bottom:1px solid var(--border);padding-bottom:16px;}
.logo{font-family:'Bebas Neue',sans-serif;font-size:44px;letter-spacing:2px;line-height:1;color:var(--blue);}
.logo span{color:var(--text);}
.header-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
.cycle-nav{display:flex;align-items:center;gap:10px;font-family:'DM Mono',monospace;font-size:13px;color:var(--muted2);}
.cycle-nav button{background:var(--surface2);border:1px solid var(--border);color:var(--text);width:28px;height:28px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;}
.cycle-nav button:hover{border-color:var(--accent);color:var(--accent);}
.sync-row{display:flex;align-items:center;gap:6px;font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:.5px;}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--muted);flex-shrink:0;}
.sync-dot.syncing{background:var(--accent2);animation:pulse .8s infinite;}
.sync-dot.synced{background:var(--accent);}
.sync-dot.error{background:var(--accent2);}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.tabs{display:flex;gap:2px;margin-bottom:20px;overflow-x:auto;padding-bottom:2px;}
.tab{background:var(--surface);border:1px solid var(--border);color:var(--muted2);padding:8px 12px;cursor:pointer;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;white-space:nowrap;}
.tab.active{color:#000;font-weight:500;background:var(--blue);border-color:var(--blue);}
.tab.lower.active{background:var(--green);border-color:var(--green);}
.tab.arms-shoulders.active{background:var(--purple);border-color:var(--purple);color:#fff;}
.tab.recap.active{background:var(--muted2);border-color:var(--muted2);}
.day-panel{display:none;}
.day-panel.active{display:block;}
.day-header{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:2px;margin-bottom:4px;color:var(--muted2);}
.day-header span{color:var(--text);}
.day-subheader{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted2);letter-spacing:1px;margin-bottom:16px;}
.superset-group{border-left:2px solid var(--purple);padding-left:10px;margin-bottom:8px;}
.superset-label{font-family:'DM Mono',monospace;font-size:9px;color:var(--purple);letter-spacing:2px;margin-bottom:5px;}
.tier-badge{font-family:'DM Mono',monospace;font-size:9px;padding:1px 5px;border-radius:2px;flex-shrink:0;font-weight:500;}
.tier-sp{background:#ff6b3522;color:var(--accent2);border:1px solid var(--accent2);}
.tier-s{background:#4fc3f715;color:var(--blue);border:1px solid #4fc3f744;}
.tier-a{background:#69f0ae15;color:var(--green);border:1px solid #69f0ae44;}
.superset-badge{font-family:'DM Mono',monospace;font-size:9px;padding:1px 6px;background:#b388ff22;color:var(--purple);border:1px solid var(--purple);border-radius:2px;flex-shrink:0;}
.exercise-grid{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;}
.exercise-row{background:var(--surface);border:1px solid var(--border);padding:10px 14px;}
.exercise-row.bonus{border-color:var(--blue);border-style:dashed;}
.exercise-row.superset-row{border-color:var(--purple);}
.exercise-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:8px;}
.exercise-name-wrap{display:flex;align-items:center;gap:6px;flex:1;min-width:0;}
.exercise-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.exercise-name.custom{color:var(--accent);}
.exercise-name.bonus-name{color:var(--blue);}
.reorder-btns{display:flex;flex-direction:column;gap:2px;flex-shrink:0;margin-right:4px;}
.reorder-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:10px;padding:1px 4px;line-height:1;}
.reorder-btn:hover{color:var(--accent);}
.edit-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:11px;padding:2px 4px;flex-shrink:0;}
.edit-btn:hover{color:var(--accent);}
.delete-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;padding:2px 4px;flex-shrink:0;}
.delete-btn:hover{color:var(--accent2);}
.link-btn{background:none;border:1px solid var(--muted);color:var(--muted);cursor:pointer;font-size:9px;padding:2px 5px;flex-shrink:0;font-family:'DM Mono',monospace;border-radius:2px;}
.link-btn:hover{border-color:var(--purple);color:var(--purple);}
.link-btn.selecting{border-color:var(--accent);color:var(--accent);animation:pulse .8s infinite;}
.link-btn.linked{border-color:var(--purple);color:var(--purple);background:#b388ff22;}
.name-edit-input{background:var(--surface2);border:1px solid var(--accent);color:var(--accent);font-family:'DM Sans',sans-serif;font-size:13px;padding:3px 8px;flex:1;min-width:0;display:none;}
.name-edit-input:focus{outline:none;}
.name-confirm-btn{background:var(--accent);border:none;color:#000;font-family:'DM Mono',monospace;font-size:10px;padding:4px 8px;cursor:pointer;flex-shrink:0;display:none;}
.exercise-meta{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted2);flex-shrink:0;}
.prev-weights{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);margin-bottom:4px;}
.sets-row{display:flex;gap:6px;align-items:center;}
.set-wrap{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;}
.set-label{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);}
.set-input{background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:'DM Mono',monospace;font-size:13px;width:100%;padding:6px 4px;text-align:center;-moz-appearance:textfield;}
.set-input::-webkit-outer-spin-button,.set-input::-webkit-inner-spin-button{-webkit-appearance:none;}
.set-input:focus{outline:none;border-color:var(--accent);}
.set-input.has-value{border-color:var(--accent);color:var(--accent);}
.unit{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);flex-shrink:0;}
.progress-bar-wrap{height:3px;background:var(--border);margin-bottom:6px;}
.progress-bar{height:100%;background:var(--accent);}
.logged-count{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted2);margin-bottom:10px;}
.add-exercise-btn{width:100%;background:transparent;border:1px dashed var(--muted);color:var(--muted2);padding:10px;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;margin-bottom:14px;}
.add-exercise-btn:hover{border-color:var(--blue);color:var(--blue);}
.notes-area{background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;width:100%;padding:12px;resize:vertical;min-height:70px;margin-bottom:12px;}
.notes-area:focus{outline:none;border-color:var(--accent);}
.notes-area::placeholder{color:var(--muted);}
.autosave-note{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);}
.finish-btn{background:transparent;border:1px solid var(--muted);color:var(--muted2);font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1px;padding:6px 12px;cursor:pointer;text-transform:uppercase;}
.section-label{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted2);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border);}
.recap-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:8px;margin-bottom:24px;}
.recap-card{background:var(--surface);border:1px solid var(--border);padding:12px;}
.recap-card .day-label{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted2);margin-bottom:4px;}
.recap-card .ex-name{font-size:12px;font-weight:500;margin-bottom:6px;line-height:1.3;}
.recap-sets{display:flex;gap:4px;flex-wrap:wrap;}
.recap-set{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--accent);line-height:1;}
.recap-set .rs-unit{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted2);}
.recap-set.empty{color:var(--muted);font-size:14px;}
.export-box{background:var(--surface);border:1px solid var(--blue);border-left:3px solid var(--blue);padding:16px 20px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.export-box-text{font-size:13px;color:var(--muted2);line-height:1.5;}
.export-box-text strong{color:var(--blue);font-weight:500;}
.ai-box{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);padding:20px;margin-bottom:16px;}
.ai-label{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2px;color:var(--accent);text-transform:uppercase;margin-bottom:12px;}
.ai-content{font-size:13px;line-height:1.75;color:var(--muted2);}
.ai-content p{margin-bottom:10px;}
.ai-content strong{color:var(--text);font-weight:500;}
.recap-section{margin-bottom:28px;}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.btn{padding:10px 20px;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;border:none;}
.btn-outline{background:transparent;border:1px solid var(--muted);color:var(--muted2);}
.btn-outline:hover{border-color:var(--accent);color:var(--accent);}
.btn-outline:disabled{opacity:.3;cursor:not-allowed;}
.btn-copy{background:var(--blue);color:#000;font-weight:500;white-space:nowrap;flex-shrink:0;}
.flash-msg{font-family:'DM Mono',monospace;font-size:11px;color:var(--accent);opacity:0;}
.flash-msg.show{opacity:1;}
.loading-overlay{position:fixed;inset:0;background:#0a0a0a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:999;}
.load-logo{font-family:'Bebas Neue',sans-serif;font-size:48px;letter-spacing:4px;color:var(--blue);}
.dot-loader{display:inline-flex;gap:5px;align-items:center;}
.dot-loader span{width:5px;height:5px;background:var(--blue);border-radius:50%;animation:blink 1.2s infinite;}
.dot-loader span:nth-child(2){animation-delay:.2s;}
.dot-loader span:nth-child(3){animation-delay:.4s;}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
</style>
</head>
<body>
<div class="loading-overlay" id="loadingOverlay">
  <div class="load-logo">TRAVEL</div>
  <div class="dot-loader"><span></span><span></span><span></span></div>
</div>
<header>
  <div class="logo">TRAVEL<span> MODE</span></div>
  <div class="header-right">
    <div class="cycle-nav">
      <button onclick="changeCycle(-1)">&#8249;</button>
      <span id="cycleLabel">CYCLE 1</span>
      <button onclick="changeCycle(1)">&#8250;</button>
    </div>
    <div class="sync-row">
      <div class="sync-dot" id="syncDot"></div>
      <span id="syncLabel">LOADING</span>
    </div>
  </div>
</header>
<div class="tabs" id="tabBar"></div>
<div id="panels"></div>
<script>
const API_KEY='$2a$10$O7oW0lYtp956/on9QP2vn.QZyrXAPrVj/ubAanzM02gjSdb9Tu2NK';
const BIN_ID='6a5203bef5f4af5e298028d3';
const NUM_SETS=4;
const PROGRAM_VERSION='tv3';
let cloudData={cycles:{},nameOverrides:{}};
let saveTimer=null;
let currentCycle=1;

const DAYS=[
  {id:'t1',label:'DAY 1',sub:'CHEST + BACK',type:'chest',exercises:[
    {name:'DB Incline Press',tier:'S+',reps:'10–12'},
    {name:'DB Flat Press',tier:'S',reps:'10–12'},
    {name:'DB Chest Fly',tier:'S',reps:'12–15'},
    {name:'Single Arm DB Row',tier:'S+',reps:'10–12'},
    {name:'DB Chest Supported Row',tier:'S+',reps:'10–12'},
    {name:'Renegade Row',tier:'S',reps:'10–12'},
    {name:'DB Rear Delt Fly',tier:'S+',reps:'12–15'},
    {name:'DB Pullover',tier:'S',reps:'12–15'},
  ]},
  {id:'t2',label:'DAY 2',sub:'LOWER + DELTS + ARMS',type:'lower',exercises:[
    {name:'DB Bulgarian Split Squat',tier:'S',reps:'10–12'},
    {name:'DB Romanian Deadlift',tier:'S',reps:'10–12'},
    {name:'DB Reverse Lunge',tier:'S',reps:'10–12'},
    {name:'Seated DB Calf Raise',tier:'A',reps:'15–20'},
    {name:'DB Lateral Raise',tier:'S',reps:'12–15'},
    {name:'Lean Away DB Lateral Raise',tier:'S+',reps:'12–15'},
    {name:'DB Curl',tier:'S+',reps:'10–12'},
    {name:'DB Overhead Tri Ext',tier:'S',reps:'12–15'},
  ]},
  {id:'t3',label:'DAY 3',sub:'CHEST + BACK + ARMS',type:'chest',exercises:[
    {name:'DB Incline Press',tier:'S',reps:'10–12'},
    {name:'DB Incline Fly',tier:'S',reps:'12–15'},
    {name:'Single Arm DB Row',tier:'S+',reps:'10–12'},
    {name:'DB Chest Supported Row',tier:'S',reps:'10–12'},
    {name:'DB Hammer Curl',tier:'S',reps:'10–12'},
    {name:'DB Incline Curl',tier:'S',reps:'10–12'},
    {name:'DB Overhead Tri Ext',tier:'S',reps:'12–15'},
    {name:'DB Skullcrusher',tier:'S',reps:'12–15'},
  ]},
  {id:'t4',label:'DAY 4',sub:'LOWER + DELTS',type:'lower',exercises:[
    {name:'DB Bulgarian Split Squat',tier:'S',reps:'10–12'},
    {name:'DB Single Leg RDL',tier:'S+',reps:'10–12'},
    {name:'DB Sumo Squat',tier:'S',reps:'12–15'},
    {name:'Seated DB Calf Raise',tier:'A',reps:'15–20'},
    {name:'DB Arnold Press',tier:'S',reps:'10–12'},
    {name:'DB Lateral Raise',tier:'S',reps:'12–15'},
    {name:'DB Rear Delt Fly',tier:'S+',reps:'12–15'},
    {name:'DB Skullcrusher',tier:'S',reps:'12–15'},
  ]},
  {id:'t5',label:'DAY 5',sub:'DELTS + ARMS BLAST',type:'arms-shoulders',exercises:[
    {name:'DB Arnold Press',tier:'S',reps:'10–12'},
    {name:'DB Shoulder Press',tier:'S',reps:'10–12'},
    {name:'DB Lateral Raise',tier:'S',reps:'12–15'},
    {name:'DB Incline Rear Delt Fly',tier:'S+',reps:'12–15'},
    {name:'DB Curl',tier:'S+',reps:'10–12'},
    {name:'DB Preacher Curl',tier:'S',reps:'10–12'},
    {name:'DB Hammer Curl',tier:'S',reps:'12–15'},
    {name:'DB Overhead Tri Ext',tier:'S',reps:'12–15'},
  ]},
  {id:'trecap',label:'RECAP',sub:'',type:'recap',exercises:[]}
];

function setSyncStatus(s,l){document.getElementById('syncDot').className='sync-dot '+s;document.getElementById('syncLabel').textContent=l;}

async function loadFromCloud(){
  const ver=localStorage.getItem('ll_tv_version');
  if(ver!==PROGRAM_VERSION){
    localStorage.removeItem('ll_tv_backup');
    cloudData={cycles:{},nameOverrides:{}};
    try{
      await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`,{method:'PUT',headers:{'Content-Type':'application/json','X-Master-Key':API_KEY},body:JSON.stringify(cloudData)});
      localStorage.setItem('ll_tv_version',PROGRAM_VERSION);
      setSyncStatus('synced','READY ✓');
    }catch(e){setSyncStatus('error','RESET FAILED');}
    document.getElementById('loadingOverlay').style.display='none';
    renderAll(true);return;
  }
  const cached=localStorage.getItem('ll_tv_backup');
  if(cached){
    try{cloudData=JSON.parse(cached);if(!cloudData.cycles)cloudData.cycles={};if(!cloudData.nameOverrides)cloudData.nameOverrides={};}
    catch(e){cloudData={cycles:{},nameOverrides:{}};}
    document.getElementById('loadingOverlay').style.display='none';
    renderAll(true);setSyncStatus('syncing','SYNCING...');
  }else{setSyncStatus('syncing','LOADING...');}
  try{
    const res=await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`,{headers:{'X-Master-Key':API_KEY}});
    const data=await res.json();
    const fresh=data.record||{cycles:{},nameOverrides:{}};
    if(!fresh.cycles)fresh.cycles={};if(!fresh.nameOverrides)fresh.nameOverrides={};
    cloudData=fresh;localStorage.setItem('ll_tv_backup',JSON.stringify(cloudData));
    setSyncStatus('synced','SYNCED');
    document.getElementById('loadingOverlay').style.display='none';renderAll(true);
  }catch(e){
    setSyncStatus('error','OFFLINE');
    if(!cached){cloudData={cycles:{},nameOverrides:{}};document.getElementById('loadingOverlay').style.display='none';renderAll(true);}
  }
}

async function saveToCloud(){
  setSyncStatus('syncing','SAVING...');
  localStorage.setItem('ll_tv_backup',JSON.stringify(cloudData));
  try{
    await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`,{method:'PUT',headers:{'Content-Type':'application/json','X-Master-Key':API_KEY},body:JSON.stringify(cloudData)});
    setSyncStatus('synced','SAVED ✓');
  }catch(e){setSyncStatus('error','SAVE FAILED');}
}
function debouncedSave(){clearTimeout(saveTimer);saveTimer=setTimeout(saveToCloud,1500);}
function ensureDay(c,d){if(!cloudData.cycles[`c${c}`])cloudData.cycles[`c${c}`]={};if(!cloudData.cycles[`c${c}`][d])cloudData.cycles[`c${c}`][d]={};}
function getSet(c,d,e,s){const sets=cloudData?.cycles?.[`c${c}`]?.[d]?.[`e${e}`];if(Array.isArray(sets))return sets[s]||'';return '';}
function setSet(c,d,e,s,v){ensureDay(c,d);let arr=cloudData.cycles[`c${c}`][d][`e${e}`];if(!Array.isArray(arr))arr=['','','',''];arr[s]=v;cloudData.cycles[`c${c}`][d][`e${e}`]=arr;debouncedSave();}
function getExName(dayId,ei){return cloudData?.nameOverrides?.[`${dayId}_${ei}`]||null;}
function setExName(dayId,ei,name){if(!cloudData.nameOverrides)cloudData.nameOverrides={};if(name)cloudData.nameOverrides[`${dayId}_${ei}`]=name;else delete cloudData.nameOverrides[`${dayId}_${ei}`];debouncedSave();}
function getUnit(c,dayId){const s=cloudData?.cycles?.[`c${c}`]?.[dayId]?.unit;if(s)return s;for(let i=c-1;i>=1;i--){const p=cloudData?.cycles?.[`c${i}`]?.[dayId]?.unit;if(p)return p;}return 'kg';}
function setUnit(c,dayId,unit){ensureDay(c,dayId);cloudData.cycles[`c${c}`][dayId].unit=unit;debouncedSave();}
function getBonusExercises(c,d){
  const thisCycle=cloudData?.cycles?.[`c${c}`]?.[d]?.bonus||[];
  if(c<=1)return thisCycle;
  const prevBonus=cloudData?.cycles?.[`c${c-1}`]?.[d]?.bonus||[];
  const removed=cloudData?.cycles?.[`c${c}`]?.[d]?.bonusRemoved||[];
  const thisNames=thisCycle.map(b=>b.name);
  const carried=prevBonus.filter(b=>!removed.includes(b.name)&&!thisNames.includes(b.name)).map(b=>({...b,sets:['','','',''],carried:true,prevSets:b.sets}));
  return [...thisCycle,...carried];
}
function saveBonusExercises(c,d,arr){ensureDay(c,d);cloudData.cycles[`c${c}`][d].bonus=arr;debouncedSave();}
function getNotes(c,d){return cloudData?.cycles?.[`c${c}`]?.[d]?.notes||'';}
function setNotes(c,d,v){ensureDay(c,d);cloudData.cycles[`c${c}`][d].notes=v;debouncedSave();}
function getAI(c){return cloudData?.cycles?.[`c${c}`]?.ai||'';}
function setAI(c,v){if(!cloudData.cycles[`c${c}`])cloudData.cycles[`c${c}`]={};cloudData.cycles[`c${c}`].ai=v;debouncedSave();}
function isSessionDone(c,dayId){return !!cloudData?.cycles?.[`c${c}`]?.[dayId]?.done;}
function markSessionDone(dayId,di){ensureDay(currentCycle,dayId);cloudData.cycles[`c${currentCycle}`][dayId].done=true;debouncedSave();const btn=document.getElementById(`finish-btn-${di}`);if(btn){btn.textContent='✓ DONE';btn.style.borderColor='var(--accent)';btn.style.color='var(--accent)';}}
function getSupersets(c,dayId){return cloudData?.cycles?.[`c${c}`]?.[dayId]?.supersets||[];}
function saveSupersets(c,dayId,arr){ensureDay(c,dayId);cloudData.cycles[`c${c}`][dayId].supersets=arr;debouncedSave();}
function getUnifiedOrder(dayId){const k=`unifiedorder_${dayId}`;const s=cloudData?.nameOverrides?.[k];return s?JSON.parse(s):null;}
function saveUnifiedOrder(dayId,order){if(!cloudData.nameOverrides)cloudData.nameOverrides={};cloudData.nameOverrides[`unifiedorder_${dayId}`]=JSON.stringify(order);debouncedSave();}

function getAllDayItems(day){
  const items=[];let ei=0;
  (day.exercises||[]).forEach(ex=>{items.push({type:'program',ei,ex});ei++;});
  (day.finisher||[]).forEach(ex=>{items.push({type:'finisher',ei,ex});ei++;});
  return items;
}
function itemKey(item){if(item.type==='bonus')return`bon_${item.name}`;return`prog_${item.ei}`;}
function getExercises(day){if(!day||day.type==='recap')return[];return[...(day.exercises||[]),...(day.finisher||[])];}
function getOrderedDayItems(day){
  const baseItems=getAllDayItems(day);
  const bonus=getBonusExercises(currentCycle,day.id);
  const bonusItems=bonus.map((bex,idx)=>({type:'bonus',idx,name:bex.name,bex}));
  const allItems=[...baseItems,...bonusItems];
  const order=getUnifiedOrder(day.id);
  if(!order)return allItems;
  const map={};allItems.forEach(item=>{map[itemKey(item)]=item;});
  const ordered=[];
  order.forEach(k=>{if(map[k]){ordered.push(map[k]);delete map[k];}});
  Object.values(map).forEach(item=>ordered.push(item));
  return ordered;
}
function isItemPaired(dayId,item){
  const key=item.type==='bonus'?`bonus_${item.idx}`:`ex_${item.ei}`;
  return getSupersets(currentCycle,dayId).some(ss=>ss.includes(key));
}

function changeCycle(dir){const n=currentCycle+dir;if(n<1)return;currentCycle=n;document.getElementById('cycleLabel').textContent=`CYCLE ${currentCycle}`;renderAll(false);}
function switchTab(idx){document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',i===idx));document.querySelectorAll('.day-panel').forEach((p,i)=>p.classList.toggle('active',i===idx));}
function renderAndStay(di){renderAll(false);switchTab(di);}

function findMostRecentDayIdx(){
  const cycleKeys=Object.keys(cloudData.cycles||{});
  let maxCycle=1;cycleKeys.forEach(k=>{const n=parseInt(k.replace('c',''));if(!isNaN(n)&&n>maxCycle)maxCycle=n;});
  for(let c=maxCycle;c>=1;c--){
    let lastDataDayIdx=-1,lastDoneDayIdx=-1;
    for(let di=0;di<DAYS.length-1;di++){
      const day=DAYS[di];if(day.type==='recap')continue;
      const exercises=getExercises(day);
      const hasData=exercises.some((_,ei)=>Array.from({length:NUM_SETS},(_,s)=>getSet(c,day.id,ei,s)).some(v=>v));
      const done=isSessionDone(c,day.id);
      if(hasData)lastDataDayIdx=di;if(hasData&&done)lastDoneDayIdx=di;
    }
    if(lastDataDayIdx>=0){
      if(c!==currentCycle){currentCycle=c;document.getElementById('cycleLabel').textContent=`CYCLE ${currentCycle}`;}
      if(lastDoneDayIdx===lastDataDayIdx){const nx=lastDataDayIdx+1;return nx<DAYS.length-1?nx:lastDataDayIdx;}
      return lastDataDayIdx;
    }
  }
  return 0;
}

let supersetSelectingDi=null,supersetSelectingEi=null,supersetSelectingIsBonus=false;
function toggleLink(dayId,di,ei,isBonus){
  const key=isBonus?`bonus_${ei}`:`ex_${ei}`;
  const supersets=getSupersets(currentCycle,dayId);
  const existing=supersets.find(ss=>ss.includes(key));
  if(existing){saveSupersets(currentCycle,dayId,supersets.filter(ss=>ss!==existing));supersetSelectingDi=null;supersetSelectingEi=null;supersetSelectingIsBonus=false;renderAndStay(di);return;}
  if(supersetSelectingDi===null){
    supersetSelectingDi=di;supersetSelectingEi=ei;supersetSelectingIsBonus=isBonus;
    const btn=document.getElementById(isBonus?`linkbtn_bonus_${di}_${ei}`:`linkbtn_${di}_${ei}`);
    if(btn)btn.classList.add('selecting');
  }else{
    const firstKey=supersetSelectingIsBonus?`bonus_${supersetSelectingEi}`:`ex_${supersetSelectingEi}`;
    if(firstKey!==key){supersets.push([firstKey,key]);saveSupersets(currentCycle,dayId,supersets);}
    supersetSelectingDi=null;supersetSelectingEi=null;supersetSelectingIsBonus=false;renderAndStay(di);
  }
}

function moveUnifiedItem(dayId,di,key,direction){
  const day=DAYS.find(d=>d.id===dayId);
  const allItems=getOrderedDayItems(day);
  const allKeys=allItems.map(itemKey);
  let order=getUnifiedOrder(dayId)||[];
  const merged=[...order.filter(k=>allKeys.includes(k))];
  allKeys.forEach(k=>{if(!merged.includes(k))merged.push(k);});
  const pos=merged.indexOf(key);if(pos===-1)return;
  const newPos=pos+direction;if(newPos<0||newPos>=merged.length)return;
  merged.splice(pos,1);merged.splice(newPos,0,key);
  saveUnifiedOrder(dayId,merged);renderAndStay(di);
}

function tierBadge(tier){const cls=tier==='S+'?'tier-sp':tier==='S'?'tier-s':'tier-a';return`<span class="tier-badge ${cls}">${tier}</span>`;}

function buildUnifiedRow(di,item,dayId,unit){
  const isBonus=item.type==='bonus';
  const ei=isBonus?item.idx:item.ei;
  const ex=isBonus?null:item.ex;
  const bex=isBonus?item.bex:null;
  const key=itemKey(item);
  const paired=isItemPaired(dayId,item);
  const linkLabel=paired?'UNLINK':'LINK';
  const linkClass=paired?'link-btn linked':'link-btn';
  const rowClass=paired?'exercise-row superset-row':(isBonus?'exercise-row bonus':'exercise-row');
  const reps=isBonus?'':ex.reps;
  let nameHtml,badgeHtml,editBtnHtml,deleteBtnHtml='';
  if(isBonus){
    const isCarried=!!bex.carried;
    const carriedBadge=isCarried?`<span style="font-family:'DM Mono',monospace;font-size:9px;color:var(--blue);border:1px solid var(--blue);padding:1px 5px;margin-left:4px;">↑</span>`:'';
    badgeHtml=paired?'<span class="superset-badge">SS</span>':'<span class="tier-badge tier-a">+</span>';
    nameHtml=`<span class="exercise-name bonus-name" id="bonus_exname_${di}_${ei}">${bex.name}</span>${carriedBadge}`;
    editBtnHtml=!isCarried?`<button class="edit-btn" id="bonus_edit_${di}_${ei}" onclick="startEditBonusName(${di},${ei},'${dayId}')">✎</button><input class="name-edit-input" id="bonus_name_${di}_${ei}" type="text" maxlength="40"><button class="name-confirm-btn" id="bonus_confirm_${di}_${ei}" onclick="confirmBonusName(${di},${ei},'${dayId}')">✓</button>`:'';
    deleteBtnHtml=`<button class="delete-btn" onclick="deleteBonusExercise('${dayId}',${di},'${bex.name}',${isCarried})">✕</button>`;
  }else{
    const customName=getExName(dayId,ei);const displayName=customName||ex.name;
    badgeHtml=paired?'<span class="superset-badge">SS</span>':tierBadge(ex.tier);
    nameHtml=`<span class="exercise-name${customName?' custom':''}" id="exname_${di}_${ei}">${displayName}</span>`;
    editBtnHtml=`<button class="edit-btn" id="exedit_${di}_${ei}" onclick="startEditName(${di},${ei},'${dayId}')">✎</button><input class="name-edit-input" id="exinput_${di}_${ei}" type="text" maxlength="40"><button class="name-confirm-btn" id="exconfirm_${di}_${ei}" onclick="confirmEditName(${di},${ei},'${dayId}')">✓</button>`;
  }
  const linkOnclick=isBonus?`toggleLink('${dayId}',${di},${ei},true)`:`toggleLink('${dayId}',${di},${ei},false)`;
  const linkBtnId=isBonus?`linkbtn_bonus_${di}_${ei}`:`linkbtn_${di}_${ei}`;
  const prevRow=(()=>{
    const prevWeights=Array.from({length:NUM_SETS},(_,s)=>currentCycle>1?getSet(currentCycle-1,dayId,ei,s):'');
    return prevWeights.some(v=>v)?`<div class="prev-weights">LAST: ${prevWeights.map(v=>v||'—').join(' · ')}</div>`:'';
  })();
  const setBoxes=Array.from({length:NUM_SETS},(_,s)=>`<div class="set-wrap"><div class="set-label">S${s+1}</div><input type="number" class="set-input" id="${isBonus?`binp_${di}_${ei}_${s}`:`inp_${di}_${ei}_${s}`}" placeholder="—" min="0" step="2.5"></div>`).join('');
  return`<div class="${rowClass}" id="exrow_${di}_${ei}"><div class="exercise-top"><div class="exercise-name-wrap"><div class="reorder-btns"><button class="reorder-btn" onclick="moveUnifiedItem('${dayId}',${di},'${key}',-1)">▲</button><button class="reorder-btn" onclick="moveUnifiedItem('${dayId}',${di},'${key}',1)">▼</button></div>${badgeHtml}${nameHtml}${editBtnHtml}</div><div style="display:flex;align-items:center;gap:8px;"><button class="${linkClass}" id="${linkBtnId}" onclick="${linkOnclick}">${linkLabel}</button>${reps?`<div class="exercise-meta">${reps}</div>`:''}${deleteBtnHtml}</div></div>${prevRow}<div class="sets-row">${setBoxes}<div class="unit unit-label-${di}">${unit}</div></div></div>`;
}

function buildDay(day,di){
  const unit=getUnit(currentCycle,day.id);
  const orderedItems=getOrderedDayItems(day);
  const customSupersets=getSupersets(currentCycle,day.id);
  let bodyHtml='';const rendered=new Set();
  orderedItems.forEach(item=>{
    const key=itemKey(item);if(rendered.has(key))return;
    if(isItemPaired(day.id,item)){
      const itemSSKey=item.type==='bonus'?`bonus_${item.idx}`:`ex_${item.ei}`;
      const pairGroup=customSupersets.find(ss=>ss.includes(itemSSKey));
      const partnerKey=pairGroup?pairGroup.find(k=>k!==itemSSKey):null;
      let partnerItem=null;
      if(partnerKey){if(partnerKey.startsWith('bonus_')){const pIdx=Number(partnerKey.replace('bonus_',''));partnerItem=orderedItems.find(it=>it.type==='bonus'&&it.idx===pIdx);}else{const pEi=Number(partnerKey.replace('ex_',''));partnerItem=orderedItems.find(it=>it.type!=='bonus'&&it.ei===pEi);}}
      if(partnerItem){
        rendered.add(key);rendered.add(itemKey(partnerItem));
        bodyHtml+=`<div class="superset-group"><div class="superset-label">◈ LINKED PAIR</div>`;
        bodyHtml+=buildUnifiedRow(di,item,day.id,unit);
        bodyHtml+=buildUnifiedRow(di,partnerItem,day.id,unit);
        bodyHtml+=`</div>`;return;
      }
    }
    rendered.add(key);bodyHtml+=buildUnifiedRow(di,item,day.id,unit);
  });
  const totalEx=getExercises(day).length;
  return`<div class="day-header"><span>${day.label}</span></div><div class="day-subheader">${day.sub}</div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
      <div style="font-family:'DM Mono',monospace;font-size:11px;color:var(--muted2);">UNIT: <span style="color:var(--accent)">${unit.toUpperCase()}</span></div>
      <button id="unit-toggle-${di}" onclick="toggleUnit('${day.id}',${di})" style="background:transparent;border:1px solid var(--muted);color:var(--muted2);font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1px;padding:5px 10px;cursor:pointer;text-transform:uppercase;" onmouseover="this.style.borderColor='var(--accent)';this.style.color='var(--accent)'" onmouseout="this.style.borderColor='var(--muted)';this.style.color='var(--muted2)'">${unit==='kg'?'Switch to LBS':'Switch to KG'}</button>
    </div>
    <div class="exercise-grid">${bodyHtml}</div>
    <button class="add-exercise-btn" onclick="addBonusExercise('${day.id}',${di})">+ Add Exercise</button>
    <div class="progress-bar-wrap"><div class="progress-bar" id="prog_${di}" style="width:0%"></div></div>
    <div class="logged-count" id="cnt_${di}">0 / ${totalEx} logged</div>
    <textarea class="notes-area" id="notes_${di}" placeholder="Session notes..."></textarea>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-top:12px;">
      <div class="autosave-note">◈ AUTO-SAVES</div>
      <button class="finish-btn" id="finish-btn-${di}" onclick="markSessionDone('${day.id}',${di})">FINISH SESSION</button>
    </div>`;
}

function buildRecap(){
  const savedAI=getAI(currentCycle);
  const cards=DAYS.filter(d=>d.type!=='recap').map(day=>{
    const exercises=getExercises(day);const unit=getUnit(currentCycle,day.id);
    return exercises.map((ex,ei)=>{
      const customName=getExName(day.id,ei);const displayName=customName||ex.name;
      const sets=Array.from({length:NUM_SETS},(_,s)=>getSet(currentCycle,day.id,ei,s));const hasAny=sets.some(v=>v);
      const setDisplay=sets.map(v=>v?`<div class="recap-set">${v}<span class="rs-unit">${unit}</span></div>`:`<div class="recap-set empty">·</div>`).join('');
      return`<div class="recap-card" style="${!hasAny?'opacity:.35':''}"><div class="day-label">${day.label}</div><div class="ex-name">${displayName}</div><div class="recap-sets">${setDisplay}</div></div>`;
    }).join('');
  }).join('');
  const aiHtml=savedAI
    ?`<div class="ai-box"><div class="ai-label">◈ AI Coach — Cycle ${currentCycle}</div><div class="ai-content" id="aiContent">${savedAI}</div></div>`
    :`<div class="ai-box"><div class="ai-label">◈ AI Coach</div><div class="ai-content" id="aiContent"><p style="color:var(--muted)">Hit Generate to get coaching notes.</p></div></div>`;
  return`<div class="day-header"><span>CYCLE ${currentCycle} RECAP</span></div>

    <div class="recap-section">

      <span class="flash-msg" id="exportFlash" style="display:block;margin-bottom:12px;">✓ Copied!</span>
    </div>
    <div class="recap-section"><div class="section-label">AI Analysis</div>${aiHtml}

function renderAll(smartOpen=false){
  const openIdx=smartOpen?findMostRecentDayIdx():0;
  document.getElementById('tabBar').innerHTML=DAYS.map((d,i)=>`<button class="tab ${d.type}${i===openIdx?' active':''}" onclick="switchTab(${i})">${d.label}</button>`).join('');
  const container=document.getElementById('panels');container.innerHTML='';
  DAYS.forEach((day,di)=>{const panel=document.createElement('div');panel.className='day-panel'+(di===openIdx?' active':'');panel.innerHTML=day.type==='recap'?buildRecap():buildDay(day,di);container.appendChild(panel);});
  DAYS.forEach((day,di)=>{
    if(day.type==='recap')return;
    const exercises=getExercises(day);
    exercises.forEach((ex,ei)=>{
      const inputEl=document.getElementById(`exinput_${di}_${ei}`);
      if(inputEl)inputEl.addEventListener('keydown',e=>{if(e.key==='Enter')confirmEditName(di,ei,day.id);});
      for(let s=0;s<NUM_SETS;s++){
        const inp=document.getElementById(`inp_${di}_${ei}_${s}`);if(!inp)continue;
        const val=getSet(currentCycle,day.id,ei,s);const prevVal=currentCycle>1?getSet(currentCycle-1,day.id,ei,s):'';
        inp.value=val;
        if(val){inp.classList.add('has-value');inp.style.color='var(--accent)';}else if(prevVal){inp.style.color='var(--muted2)';}
        inp.addEventListener('focus',()=>{if(!inp.value)inp.style.color='var(--text)';});
        inp.addEventListener('blur',()=>{if(!inp.value&&prevVal)inp.style.color='var(--muted2)';});
        inp.addEventListener('input',()=>{setSet(currentCycle,day.id,ei,s,inp.value);inp.classList.toggle('has-value',!!inp.value);inp.style.color=inp.value?'var(--accent)':(prevVal?'var(--muted2)':'var(--text)');updateProgress(di);});
      }
    });
    const bonus=getBonusExercises(currentCycle,day.id);
    bonus.forEach((bex,bi)=>{
      const nameInp=document.getElementById(`bonus_name_${di}_${bi}`);
      if(nameInp)nameInp.addEventListener('keydown',e=>{if(e.key==='Enter')confirmBonusName(di,bi,day.id);});
      for(let s=0;s<NUM_SETS;s++){
        const inp=document.getElementById(`binp_${di}_${bi}_${s}`);if(!inp)continue;
        inp.value=bex.sets[s]||'';if(inp.value){inp.classList.add('has-value');inp.style.color='var(--accent)';}
        inp.addEventListener('input',()=>{
          ensureDay(currentCycle,day.id);let saved=cloudData.cycles[`c${currentCycle}`][day.id].bonus||[];
          const existing=saved.find(b=>b.name===bex.name);
          if(existing){existing.sets[s]=inp.value;}else{const ne={name:bex.name,sets:['','','','']};ne.sets[s]=inp.value;saved.push(ne);cloudData.cycles[`c${currentCycle}`][day.id].bonus=saved;}
          debouncedSave();inp.classList.toggle('has-value',!!inp.value);inp.style.color=inp.value?'var(--accent)':'var(--text)';updateProgress(di);
        });
      }
    });
    const notes=document.getElementById(`notes_${di}`);
    if(notes){notes.value=getNotes(currentCycle,day.id);notes.addEventListener('input',()=>setNotes(currentCycle,day.id,notes.value));}
    const fb=document.getElementById(`finish-btn-${di}`);
    if(fb&&isSessionDone(currentCycle,day.id)){fb.textContent='✓ DONE';fb.style.borderColor='var(--accent)';fb.style.color='var(--accent)';}
    updateProgress(di);
  });
}

function updateProgress(di){
  const day=DAYS[di];if(!day||day.type==='recap')return;
  const exercises=getExercises(day);let n=0;
  exercises.forEach((_,ei)=>{for(let s=0;s<NUM_SETS;s++){if(getSet(currentCycle,day.id,ei,s)){n++;break;}}});
  const pct=Math.round(n/exercises.length*100);
  const bar=document.getElementById(`prog_${di}`);const cnt=document.getElementById(`cnt_${di}`);
  if(bar)bar.style.width=pct+'%';if(cnt)cnt.textContent=`${n} / ${exercises.length} logged`;
}

function toggleUnit(dayId,di){
  const current=getUnit(currentCycle,dayId);const next=current==='lbs'?'kg':'lbs';
  setUnit(currentCycle,dayId,next);
  document.querySelectorAll(`.unit-label-${di}`).forEach(el=>el.textContent=next);
  const day=DAYS[di];if(!day)return;
  getExercises(day).forEach((ex,ei)=>{
    for(let s=0;s<NUM_SETS;s++){const inp=document.getElementById(`inp_${di}_${ei}_${s}`);if(!inp||!inp.value)continue;
      const num=parseFloat(inp.value);if(isNaN(num))continue;
      const converted=next==='kg'?(num/2.2046).toFixed(1):(num*2.2046).toFixed(1);
      inp.value=converted;setSet(currentCycle,dayId,ei,s,converted);}
  });
  const btn=document.getElementById(`unit-toggle-${di}`);if(btn)btn.textContent=next==='kg'?'Switch to LBS':'Switch to KG';
}

function confirmEditName(di,ei,dayId){const n=document.getElementById(`exname_${di}_${ei}`);const i=document.getElementById(`exinput_${di}_${ei}`);const c=document.getElementById(`exconfirm_${di}_${ei}`);const b=document.getElementById(`exedit_${di}_${ei}`);const newName=i.value.trim();const defaultName=DAYS[di].exercises[ei]?.name||'';if(newName&&newName!==defaultName){n.textContent=newName;n.classList.add('custom');setExName(dayId,ei,newName);}else{n.textContent=defaultName;n.classList.remove('custom');setExName(dayId,ei,null);}n.style.display='block';if(b)b.style.display='block';i.style.display='none';c.style.display='none';}

function confirmBonusName(di,bi,dayId){const n=document.getElementById(`bonus_exname_${di}_${bi}`);const i=document.getElementById(`bonus_name_${di}_${bi}`);const c=document.getElementById(`bonus_confirm_${di}_${bi}`);const b=document.getElementById(`bonus_edit_${di}_${bi}`);const newName=i.value.trim()||'New Exercise';n.textContent=newName;n.style.display='block';if(b)b.style.display='block';i.style.display='none';c.style.display='none';const bonus=getBonusExercises(currentCycle,dayId);if(bonus[bi]){bonus[bi].name=newName;saveBonusExercises(currentCycle,dayId,bonus);}}

function deleteBonusExercise(dayId,di,bonusName,isCarried){

  ensureDay(currentCycle,dayId);cloudData.cycles[`c${currentCycle}`][dayId].bonus=(cloudData.cycles[`c${currentCycle}`][dayId].bonus||[]).filter(b=>b.name!==bonusName);debouncedSave();renderAndStay(di);
}

function exportCycle(){
  let maxCycle=0;Object.keys(cloudData.cycles||{}).forEach(k=>{const n=parseInt(k.replace('c',''));if(!isNaN(n)&&n>maxCycle)maxCycle=n;});
  let text=`TRAVEL — FULL HISTORY\n${'='.repeat(30)}\nCycle: ${currentCycle} | Total: ${maxCycle}\n\n`;
  for(let c=1;c<=maxCycle;c++){
    let hasData=false;
    DAYS.filter(d=>d.type!=='recap').forEach(day=>{if(getExercises(day).some((_,ei)=>Array.from({length:NUM_SETS},(_,s)=>getSet(c,day.id,ei,s)).some(v=>v)))hasData=true;});
    if(!hasData)continue;
    text+=`── CYCLE ${c} ──\n`;
    DAYS.filter(d=>d.type!=='recap').forEach(day=>{
      const exercises=getExercises(day);const unit=getUnit(c,day.id);const notes=getNotes(c,day.id);
      let hasD=exercises.some((_,ei)=>Array.from({length:NUM_SETS},(_,s)=>getSet(c,day.id,ei,s)).some(v=>v));
      if(!hasD&&!notes)return;
      text+=`${day.label} [${unit.toUpperCase()}]\n`;
      exercises.forEach((ex,ei)=>{const sets=Array.from({length:NUM_SETS},(_,s)=>getSet(c,day.id,ei,s));if(!sets.some(v=>v))return;text+=`  ${getExName(day.id,ei)||ex.name}: ${sets.map((v,s)=>v?`S${s+1}:${v}${unit}`:'').filter(Boolean).join(' | ')}\n`;});
      if(notes)text+=`  Notes: ${notes}\n`;
    });text+='\n';
  }
  text+=`── PROGRESSION ──\n`;
  DAYS.filter(d=>d.type!=='recap').forEach(day=>{
    getExercises(day).forEach((ex,ei)=>{
      const history=[];for(let c=1;c<=maxCycle;c++){const sets=Array.from({length:NUM_SETS},(_,s)=>getSet(c,day.id,ei,s)).filter(Boolean);if(sets.length)history.push(`C${c}:${Math.max(...sets.map(Number))}`);}
      if(history.length>1)text+=`  ${getExName(day.id,ei)||ex.name}: ${history.join(' → ')}\n`;
    });
  });
  text+=`\nPaste into Claude and say "cycle check-in".`;
  navigator.clipboard.writeText(text).then(()=>{const el=document.getElementById('exportFlash');if(el){el.classList.add('show');setTimeout(()=>el.classList.remove('show'),3000);}}).catch(()=>{prompt('Copy this:',text);});
}

async function generateRecap(){
  const btn=document.getElementById('genBtn');const content=document.getElementById('aiContent');
  btn.disabled=true;btn.innerHTML='...';
  let prompt=`Expert strength coach. Analyze this travel training cycle.\nGoals: Maintain muscle, pump, stay lean while traveling. Dumbbells only.\n\nCycle ${currentCycle}:\n\n`;
  DAYS.filter(d=>d.type!=='recap').forEach(day=>{
    const exercises=getExercises(day);const unit=getUnit(currentCycle,day.id);
    prompt+=`${day.label} (${day.sub}) [${unit.toUpperCase()}]:\n`;
    exercises.forEach((ex,ei)=>{const sets=Array.from({length:NUM_SETS},(_,s)=>getSet(currentCycle,day.id,ei,s));if(!sets.some(v=>v))return;prompt+=`  ${getExName(day.id,ei)||ex.name}: ${sets.map((v,s)=>v?`S${s+1}:${v}${unit}`:'').filter(Boolean).join(', ')}\n`;});
    const n=getNotes(currentCycle,day.id);if(n)prompt+=`  Notes: ${n}\n`;prompt+='\n';
  });
  prompt+=`Provide: 1. Overview 2. Wins 3. Next Cycle Targets 4. Watch Points. HTML <p> and <strong> only.`;
  try{
    const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:800,messages:[{role:"user",content:prompt}]})});
    const data=await res.json();const text=data.content?.map(b=>b.text||'').join('')||'Error.';
    content.innerHTML=text;setAI(currentCycle,text);
  }catch(e){content.innerHTML='<p style="color:var(--accent2)">Connection error.</p>';}
  btn.disabled=false;btn.textContent='Regenerate Recap';
}

loadFromCloud();
</script>
